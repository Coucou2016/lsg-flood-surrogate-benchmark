# Lower Brisbane River floodplain — LSG case study configuration
# Wang, W., Wang, Q. J., & Nathan, R. (2026). WRR 62, e2025WR042481
#
# Paths are relative to the project root (directory containing config/).
# Override with $LSG_PROJECT_ROOT if needed. Do not hard-code a drive letter.

study_area:
  name: Lower Brisbane River floodplain
  crs: EPSG:28356
  crs_note: >
    GDA94 / MGA zone 56 is the usual BRCFS / SEQ mapping CRS. The paper does
    not state an EPSG code. Confirm against licensed TUFLOW control files.
  notes: >
    Urbanized floodplain with tidal influences, dam regulation (Wivenhoe/Somerset),
    multiple tributaries, and backwater effects. HF/LF grids come from the BRCFS
    TUFLOW model (licensed by the Queensland Government), not from this repo.

paths:
  project_root: null
  dem: data/raw/dem/dem.tif
  hf_results: data/raw/hf
  lf_results: data/raw/lf120
  lf_resolutions:
    lf120: data/raw/lf120
    lf300: data/raw/lf300
  processed: data/processed
  models: outputs/models
  evaluation: outputs/evaluation
  metadata: data/metadata

hydrodynamic:
  depth_threshold_m: 0.03
  extent_binary_threshold: 0.5
  # Paper: 30 m computational HF grid; TUFLOW writes 15 m output rasters.
  hf_cell_size_m: 30
  hf_output_cell_size_m: 15
  timestep_hours: 2
  lf_resolutions_m:
    lf120:
      computational_m: 120
      output_m: 60
    lf300:
      computational_m: 300
      output_m: 150

lsg:
  weight_by_cell_area: true
  max_eof_modes: 100
  inducing_point_fraction: 0.02
  gp_kernel: exponential
  train_test_split: 0.8
  random_seed: 42
  zoning: none
  n_zones: 4
  residual_eof_modes: 3

events:
  catalog: data/metadata/events.csv
  splits_file: data/metadata/splits.yaml
  synthetic_only: false
  splits:
    validation: [FE21, FE26, FE50, FE51]
    lsg_ts_train: [FE20, FE22, FE27, FE30, FE32, FE34, FE48, FE49]
    lsg_ts_synthetic_train: [FE20, FE22, FE27, FE30, FE32, FE34]

variants:
  lsg_ts:
    use_time_series: true
    derive_max_from_ts: true
    n_train_events_paper: 8
  lsg_max:
    use_time_series: false
    train_on_max_surface: true
    n_train_events_paper: 47

evaluation:
  metrics:
    - rmse_depth
    - csi
    - pod
    - rfa
    - crps
    - brier
  uq: true
  error_budget: true
  contingency_threshold_m: 0.03

synthetic_demo:
  n_events: 12
  n_timesteps: 48
  grid_nx: 40
  grid_ny: 30
  lf_coarsening_factor: 4
  lf_resolution_factors:
    lf120: 4
    lf300: 10
