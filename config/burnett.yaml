# Burnett River (AU) — published LSG benchmark with already-computed HF/LF.
#
# Fraehr (2024) Figshare 10.26188/24312658, file BurnettRV.zip (~32 GB, CC BY 4.0).
# HF = TUFLOW (~10 m), LF = HEC-RAS (Model B). Do not re-run solvers.
#
# Local data: junctions under data/external/burnett/ → sibling Fraehr unzip at
# I:\Projects\202606-JOH-zonal-LSG\data\external\fraehr2024\BurnettRV.
# Event ids follow LF plan numbers (p12 → E12) via BurnettRV_event_summary.csv.

study_area:
  id: burnett
  name: Burnett River, Australia
  notes: >
    Steep coastal river multi-fidelity benchmark (TUFLOW × HEC-RAS). Paper
    zonal hypothesis: LF weaker than Chowilla floodplain anti-case; H-LSG
    residual zones may matter more than on Chowilla. 74 CV events in 4 groups
    (Grp1 = 18 events, plans p01/p03–p19).

ingest:
  kind: fraehr
  # Full TS: ~780k HF cells × hundreds of steps × 74 events does not fit in RAM.
  # Use per-event max depth (TUFLOW wl_data after 48-step pad; LF Summary Max).
  time_reduction: max

paths:
  project_root: null
  case_root: data/external/burnett
  dem: data/external/burnett
  hf_results: data/external/burnett
  lf_results: data/external/burnett
  processed: data/processed/burnett
  models: outputs/models/burnett
  evaluation: outputs/evaluation/burnett
  metadata: data/external/burnett

hydrodynamic:
  depth_threshold_m: 0.03
  extent_binary_threshold: 0.5
  # TUFLOW HF grid ~10 m (see Geometry_data/Tuflow_Geometry_data.npz).
  hf_cell_size_m: 10
  timestep_hours: 1

lsg:
  # Same Carlisle-proven stack: EXT+WSE dual path.
  field: wse_ext
  weight_by_cell_area: true
  max_eof_modes: 100
  inducing_point_fraction: 0.02
  min_inducing_points: 16
  gp_kernel: exponential
  train_test_split: 0.8
  random_seed: 20260814
  # Prefer residual_kmeans (Carlisle/Chowilla). If residual EOF / zone fit is
  # unstable on this mesh, switch to none and document in README / cases.yaml.
  zoning: residual_kmeans
  n_zones: 4
  residual_eof_modes: 3

events:
  synthetic_only: false
  # Fraehr leave-one-group-out: ValidateOnGrp_1 holds out Group 1 (18 events).
  # Event ids E{n} map to HEC_RAS_plan p{n} (CSV); HF stems Paradise_{tuflow}_002.npz.
