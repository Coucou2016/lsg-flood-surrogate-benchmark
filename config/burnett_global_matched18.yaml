# Burnett River (AU) — global-only A/B twin of config/burnett.yaml
# (lsg.zoning: none). Same data paths, Grp1 splits, and paper stack otherwise.

study_area:
  id: burnett_global_matched18
  name: Burnett River, Australia
  notes: >
    Global-only control for H-LSG residual_kmeans A/B on Burnett. Same Fraehr
    TUFLOW × HEC-RAS dump and Grp1 leave-one-group-out as config/burnett.yaml.

ingest:
  kind: fraehr
  time_reduction: max

paths:
  project_root: null
  case_root: data/external/burnett
  dem: data/external/burnett
  hf_results: data/external/burnett
  lf_results: data/external/burnett
  processed: data/processed/burnett
  # Separate from H-LSG residual_kmeans states under outputs/models/burnett
  models: outputs/models/burnett_global_matched18
  evaluation: outputs/evaluation/burnett
  metadata: data/external/burnett

hydrodynamic:
  depth_threshold_m: 0.03
  extent_binary_threshold: 0.5
  hf_cell_size_m: 10
  timestep_hours: 1

lsg:
  field: wse_ext
  weight_by_cell_area: true
  max_eof_modes: 100
  inducing_point_fraction: 0.02
  min_inducing_points: 16
  gp_kernel: exponential
  train_test_split: 0.8
  random_seed: 20260814
  zoning: none
  n_zones: 4
  residual_eof_modes: 3
  # Capacity-matched control: override North/Kaiser retained count.
  force_n_modes: 18

